sonar.organization=migueldonaire
sonar.projectKey=migueldonaire_minimalist-design-portfolio

# Qué se analiza y qué no
sonar.sources=.
sonar.exclusions=node_modules/**,tests/**,.github/**,lcov.info,assets/**,**/*.png,**/*.jpg,**/*.woff2
sonar.sourceEncoding=UTF-8
sonar.tests=tests
#
# Cobertura: informe generado por los tests
sonar.javascript.lcov.reportPaths=lcov.info

# Esperar al Quality Gate y fallar si no se cumple
sonar.qualitygate.wait=true