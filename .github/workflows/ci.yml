name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build de la imagen Docker
        run: docker build -t web:ci .

      - name: Análisis con SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}